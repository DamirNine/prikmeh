<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Укупориватель — 3D-сборка</title>
<style>
:root{--ink:#16202c;--ink2:#56616f;--line:#d7dce4;--panel:#ffffff;--bg1:#f1f3f7;--bg2:#d5dbe4;--acc:#2563c9;--acc-ink:#fff;
  --work:#b45309;--ok:#2f8f5b;--hl:#f2a900}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg1);overflow:hidden}
#app{display:grid;grid-template-columns:330px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
#side header{padding:18px 20px 12px}
.kicker{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h1{font-size:21px;line-height:1.2;margin:4px 0 0}
#steps{list-style:none;margin:0;padding:4px 10px 8px;overflow:auto;flex:1;min-height:0}
#steps li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;position:relative;color:var(--ink2);user-select:none}
#steps li:hover{background:#f2f5f9}
#steps .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #b9c1cc;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:#fff}
#steps li.done{color:var(--ink)}
#steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
#steps li.act{background:#eaf1fc;color:var(--ink);font-weight:600}
#steps li.act .n{border-color:var(--acc);color:var(--acc)}
#steps li .pr{position:absolute;left:44px;right:10px;bottom:2px;height:2px;background:#cfdcf3;border-radius:2px;overflow:hidden;display:none}
#steps li.act .pr{display:block}
#steps li .pr i{display:block;height:100%;width:0;background:var(--acc)}
#desc{border-top:1px solid var(--line);padding:14px 20px 18px;min-height:150px}
#desc h2{font-size:15.5px;margin:0 0 6px}
#desc p{margin:0;color:var(--ink2);font-size:14px}
#read{margin-top:10px;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink);background:#f4f6f9;border-radius:8px;padding:7px 10px;display:none}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 60% 35%,var(--bg1) 0%,var(--bg2) 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#bar{position:absolute;left:12px;right:12px;margin:0 auto;width:max-content;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 28px rgba(22,32,44,.14);max-width:calc(100% - 24px)}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid #c5ccd6;border-radius:9px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.1}
button:hover:not(:disabled){background:#f2f5f9;border-color:#aab3bf}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,select:focus-visible,#steps li:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.pri:hover:not(:disabled){background:#1f55ad;border-color:#1f55ad}
button.work{border-color:var(--work);color:var(--work);font-weight:600}
button.work.on{background:var(--work);color:#fff}
button svg{width:16px;height:16px;fill:currentColor;flex:none}
.sep{width:1px;background:var(--line);margin:2px 2px}
#opts{position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;
  background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:13.5px;max-width:calc(100% - 28px)}
#opts label{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);cursor:pointer}
#opts button{padding:6px 10px;font-size:13.5px}
select{font:inherit;font-size:13.5px;border:1px solid #c5ccd6;border-radius:8px;padding:5px 6px;background:#fff;color:var(--ink)}
#hint{font-size:12.5px;color:var(--ink2);padding:10px 20px 14px;border-top:1px solid var(--line)}
#tag{position:absolute;left:0;top:0;transform:translate(-50%,-150%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:4px 9px;border-radius:7px;pointer-events:none;display:none;white-space:nowrap}
#tag:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
#err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--ink2)}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #side{border-right:0;border-bottom:1px solid var(--line)}
  #side header{padding:10px 14px 4px}
  h1{font-size:17px}
  #steps{display:flex;gap:4px;padding:4px 10px;overflow-x:auto;flex:none}
  #steps li{padding:4px}
  #steps li .t,#steps li .pr{display:none!important}
  #desc{padding:6px 14px 10px;min-height:0;border-top:0}
  #desc p{font-size:13px}
  #hint{display:none}
  #opts{top:8px;right:8px}
  #bar{bottom:10px}
  button{padding:8px 10px}
  button .lb2{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <div class="kicker">УКП.00.000 · тангенсный механизм</div>
      <h1>Ручной укупориватель: сборка в 3D</h1>
    </header>
    <ol id="steps"></ol>
    <div id="desc"><h2 id="dh"></h2><p id="dp"></p><div id="read"></div></div>
    <div id="hint">Мышь: левая кнопка — вращать, колесо — приблизить, правая кнопка — двигать. На телефоне — пальцами.</div>
  </aside>
  <main id="stage">
    <canvas id="c" tabindex="0" aria-label="3D-модель укупоривателя"></canvas>
    <div id="opts">
      <label>Скорость
        <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      </label>
      <label><input type="checkbox" id="autocam" checked> Камера следит за шагом</label>
      <button id="bCover" title="Показать, сделать прозрачным или скрыть кожух">Кожух: виден</button>
      <button id="bView" title="Вернуть общий вид">Общий вид</button>
      <button id="bClose" title="Приблизить к механизму: камень, палец, ползун и направляющая">Крупно</button>
    </div>
    <div id="tag"></div>
    <div id="bar">
      <button id="bReset" title="Убрать все детали (R)"><svg viewBox="0 0 16 16"><path d="M8 3V.8L4.6 3.9 8 7V4.7a3.8 3.8 0 1 1-3.7 4.6H2.6A5.5 5.5 0 1 0 8 3z"/></svg>Разобрать всё</button>
      <button id="bPrev" title="Вернуть последнюю деталь (←)"><svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM13 3v10L6 8z"/></svg>Шаг назад</button>
      <button id="bNext" class="pri" title="Следующая деталь; повторное нажатие ставит её на место сразу (→ или пробел)"><span id="lNext">Следующий шаг</span><svg viewBox="0 0 16 16"><path d="M11 3h2v10h-2zM3 3v10l7-5z"/></svg></button>
      <button id="bAll" title="Собрать всё по порядку (Enter)"><svg id="iAll" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg><span id="lAll">Собрать всё</span></button>
      <span class="sep"></span>
      <button id="bWork" class="work" title="Показать механизм в работе (W)"><svg viewBox="0 0 16 16"><path d="M9.6 1l.4 1.8 1.2.5 1.6-1 1.4 1.5-1 1.5.5 1.3 1.8.4v2l-1.8.4-.5 1.2 1 1.6-1.4 1.4-1.6-1-1.2.5-.4 1.9h-2l-.4-1.9-1.3-.5-1.5 1-1.5-1.4 1-1.6-.5-1.2L1 9V7l1.9-.4.5-1.3-1-1.5 1.5-1.5 1.5 1 1.3-.5L7.6 1zM8.6 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg><span id="lWork">Работа механизма</span></button>
    </div>
    <div id="err">Не удалось запустить 3D-графику (WebGL). Откройте файл в свежей версии Chrome, Edge, Firefox или Safari.</div>
  </main>
</div>
<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>
/*__DATA__*/
(function () {
"use strict";
const D2R = Math.PI / 180, { E, PH_N, PH_K, PH0, Z_ST, Y_ST0, Z_KUL, Z_KAM, Z_PIN, Z_WASHER, Z_NUT, SCR_X, SCR_Y } = DATA;
const yD = ph => E * Math.tan(ph * D2R), sD = ph => E / Math.cos(ph * D2R);   // высота пальца D и его расстояние от оси O вдоль кулисы
const DZ = 150, S_FAR = 548, S_MID = 250;                 // вынос подсборки вперёд; камень за концом рукояти; середина кулисы
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const num = (x, d = 1) => x.toFixed(d).replace(".", ",").replace("-", "−");
const $ = id => document.getElementById(id);

// ------------------------------------------------------------------ шаги (как в «Инструкции по сборке»)
const STEPS = [
  { t: "Стойка", d: "Поставьте стойку основанием на стол. На ней уже есть ось O, два упора рукояти, выемка под направляющую с резьбовым отверстием М10 в дне и два зацепа для кожуха.", dur: 2.2, hl: ["stand"], tag: "Стойка" },
  { t: "Камень на кулису", d: "Наденьте камень на кулису с дальнего конца рукояти и сдвиньте к середине. Стенка камня с отверстием и втулка кулисы смотрят в разные стороны. Палец пока не ставится — он войдёт через ползун.", dur: 3.8, hl: ["kamen", "kulisa"], tag: "Камень" },
  { t: "Кулиса на ось O", d: "Сдвиньте камень к отверстию и наденьте кулису на ось O до упора в стойку: рукоять встаёт между упорами, отверстие камня смотрит вперёд.", dur: 4.4, hl: ["kulisa", "kamen"], tag: "Кулиса с камнем" },
  { t: "Направляющая", d: "Задвиньте направляющую спереди: пластину — в выемку стойки до дна, планки — по обе стороны от камня, полка с отверстием под шток — внизу. Резьбовые отверстия пластины и стойки встают соосно.", dur: 3.4, hl: ["guide"], tag: "Направляющая" },
  { t: "Винт М10", d: "Вверните установочный винт М10 × 10 ключом-шестигранником S5 (деталь 11) через пластину в стойку — до упора, заподлицо с площадкой. Винт держит направляющую в выемке. Ставится до ползуна — потом шток и брусок закроют к нему доступ.", dur: 3.8, hl: ["screw", "key"], tag: "Винт М10" },
  { t: "Ползун сверху", d: "Опустите ползун (брусок со штоком) сверху между планками направляющей: шток проходит в отверстие полки, брусок встаёт перед камнем, его отверстие — напротив отверстия камня.", dur: 3.6, hl: ["polzun"], tag: "Ползун" },
  { t: "Палец через ползун", d: "Вставьте палец гладким концом спереди через отверстие бруска ползуна в камень — до упора, резьба остаётся снаружи. В камне палец сидит туго, ползун на нём поворачивается свободно.", dur: 3.2, hl: ["pin"], tag: "Палец" },
  { t: "Шайба и гайка", d: "Наденьте шайбу на резьбовой конец пальца и навинтите гайку М10 до упора — дальше её не пустит конец резьбы. Шайба остаётся с зазором 0,5 мм, ползун свободно поворачивается на пальце.", dur: 3.6, hl: ["washer", "nut"], tag: "Шайба и гайка" },
  { t: "Головка на клей", d: "Капните клей (эпоксидный или суперклей) в гнездо головки и сразу наденьте её снизу на хвостовик штока до упора, конусом вниз; держите ровно, пока клей не схватится. Клеится последней: головка шире отверстия полки, после неё ползун из направляющей не вынуть.", dur: 5.6, hl: ["head"], tag: "Головка" },
  { t: "Проверка хода", d: "Поднимите рукоять до верхнего упора и плавно опустите до нижнего: ползун идёт строго вертикально — брусок между планками, шток в полке; ход колокола — 16 мм.", dur: 4.6, hl: ["kulisa"], tag: "" },
  { t: "Кожух", d: "Поставьте рукоять посередине хода и надвиньте кожух спереди до листа стойки: паз — на рукоять, паз в дне — на шток. Крючки боковых язычков наезжают скосом на зацепы стойки, язычки отгибаются наружу и в конце защёлкиваются (нажим около 10 Н). Снять: отжать оба язычка и потянуть кожух вперёд.", dur: 3.2, hl: ["cover"], tag: "Кожух" }];
const N = STEPS.length;
const WORK = { t: "Механизм в работе", d: "Бутылка с пробкой ставится под колокол. Нажим на рукоять опускает колокол на 16 мм: первые 10 мм — подход, последние 6 мм конус обжимает пробку на горлышке." };
const IDLE0 = { t: "Сборка с нуля", d: "Нажмите «Следующий шаг», чтобы поставить первую деталь, или «Собрать всё» — детали встанут на места по порядку. Модель можно вращать, приближать и двигать мышью или пальцами." };
const DONE = { t: "Механизм собран", d: "Все детали на месте. Нажмите «Работа механизма», чтобы увидеть, как он закупоривает бутылку, или разберите его и соберите заново." };

function baseState(n) {                                    // состояние после n выполненных шагов
  return { phi: PH0, hl: 0, hlKeys: [], bottle: null,
    stand: { o: +(n >= 1), dy: 0 },
    kamen: { o: +(n >= 2), s: n === 2 ? S_MID : null, dz: n === 2 ? DZ : 0 },
    kulisa: { o: +(n >= 2), dz: n === 2 ? DZ : 0 },
    guide: { o: +(n >= 4), dz: 0 }, screw: { o: +(n >= 5), dz: 0, spin: 0 }, key: { o: 0 },
    polzun: { o: +(n >= 6), dz: 0, dy: 0 }, pin: { o: +(n >= 7), dz: 0 },
    washer: { o: +(n >= 8), dz: 0 }, nut: { o: +(n >= 8), dz: 0, spin: 0 }, head: { o: +(n >= 9), dy: 0 },
    glue: { o: 0, k: 1, drop: 0, pud: 0 },                // тюбик клея: видимость, вынос (1 — далеко), капля 0…1, клей на торце
    cover: { o: +(n >= 11), dz: 0 } };
}
const MOVE = [
  (S, t) => { S.stand.o = seg(t, 0, .45); S.stand.dy = 80 * (1 - ease(t)); },
  (S, t) => { S.kulisa.o = seg(t, 0, .25); S.kulisa.dz = DZ + 40 * (1 - ease(seg(t, 0, .3)));
              S.kamen.o = seg(t, .2, .4); S.kamen.s = lerp(S_FAR, S_MID, ease(seg(t, .35, 1))); S.kamen.dz = DZ; },
  (S, t) => { S.kamen.s = lerp(S_MID, sD(PH0), ease(seg(t, 0, .45))); S.kamen.dz = S.kulisa.dz = DZ * (1 - ease(seg(t, .45, 1))); },
  (S, t) => { S.guide.o = seg(t, 0, .22); S.guide.dz = DZ * (1 - ease(seg(t, .1, 1))); },
  (S, t) => { S.screw.o = seg(t, 0, .18);                 // подлёт спереди до входа в резьбу, затем 10 мм ввинчивания: оборот на 1,5 мм
              const dz = t < .38 ? 10 + 45 * (1 - ease(seg(t, .04, .38))) : 10 * (1 - ease(seg(t, .38, 1)));
              S.screw.dz = dz; S.screw.spin = 2 * Math.PI * Math.min(dz, 10) / 1.5;
              S.key.o = Math.min(seg(t, .02, .2), 1 - seg(t, .9, 1)); },   // ключ в гнезде винта, крутится вместе с ним
  (S, t) => { S.polzun.o = seg(t, 0, .2); S.polzun.dy = 150 * (1 - ease(seg(t, .08, 1))); },   // сверху, шток — в полку
  (S, t) => { S.pin.o = seg(t, 0, .2); S.pin.dz = 60 * (1 - ease(seg(t, .12, 1))); },          // спереди через ползун в камень
  (S, t) => { S.washer.o = seg(t, 0, .18); S.washer.dz = 60 * (1 - ease(seg(t, .05, .5)));
              S.nut.o = seg(t, .38, .55); const k = ease(seg(t, .42, 1)); S.nut.dz = 60 * (1 - k); S.nut.spin = 5 * Math.PI * (1 - k); },
  (S, t) => { S.head.o = seg(t, 0, .1); S.head.dy = -70 * (1 - ease(seg(t, .62, 1)));          // клей в гнездо, затем головку — на хвостовик
              S.glue.o = Math.min(seg(t, .08, .16), 1 - seg(t, .52, .6));
              S.glue.k = 1 - ease(seg(t, .08, .28)) + ease(seg(t, .48, .6));
              S.glue.drop = seg(t, .3, .46); S.glue.pud = seg(t, .42, .47) * (1 - seg(t, .94, 1)); },
  (S, t) => { S.phi = t < .28 ? lerp(PH0, PH_N, ease(t / .28)) : t < .75 ? lerp(PH_N, PH_K, ease((t - .28) / .47)) : lerp(PH_K, PH0, ease((t - .75) / .25)); },
  (S, t) => { S.cover.o = seg(t, 0, .22); S.cover.dz = 120 * (1 - ease(seg(t, .1, 1))); }];
const WCYC = [1.1, 1.6, .45, 1.2, 1.1, .35];               // бутылка въезжает, рукоять вниз, пауза, вверх, бутылка уезжает, пауза
const WSUM = WCYC.reduce((a, b) => a + b, 0), TRAVEL0 = yD(PH_N);
function workState(tw) {
  const S = baseState(N); let t = tw % WSUM, k = 0;
  while (t > WCYC[k]) { t -= WCYC[k]; k++; }
  const u = t / WCYC[k], B = { z: 0, o: 1, f: 0 };
  if (k === 0) { S.phi = PH_N; B.z = 150 * (1 - ease(u)); B.o = seg(u, 0, .3); }
  else if (k === 1) S.phi = lerp(PH_N, PH_K, ease(u));
  else if (k === 2) S.phi = PH_K;
  else if (k === 3) S.phi = lerp(PH_K, PH_N, ease(u));
  else if (k === 4) { S.phi = PH_N; B.z = 150 * ease(u); B.o = 1 - seg(u, .7, 1); }
  else { S.phi = PH_N; B.o = 0; }
  B.f = k === 1 ? clamp((TRAVEL0 - yD(S.phi) - 10) / 6) : k >= 2 && k <= 4 ? 1 : 0;   // обжим: последние 6 мм хода
  S.bottle = B;
  return S;
}

// ------------------------------------------------------------------ сцена
let renderer;
const canvas = $("c"), stage = $("stage");
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { $("err").style.display = "grid"; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 5, 9000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .09; controls.minDistance = 60; controls.maxDistance = 4000;
controls.zoomSpeed = 1.1; controls.rotateSpeed = .9;
scene.add(new THREE.HemisphereLight(0xffffff, 0x7d8696, .52));
const key = new THREE.DirectionalLight(0xffffff, .62); key.position.set(500, 800, 900); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, .22); fill.position.set(-700, 150, 500); scene.add(fill);

      : S.cover.dz <= 0 ? "Защёлкнулось: крючки за зацепами стойки" : "Крючки подходят к зацепам стойки";
  } else if (work || (anim && anim.i === 8)) {
    read.style.display = "block";
    read.textContent = "Угол рукояти φ = " + num(S.phi) + "° · колокол опущен на " + num(Math.max(0, TRAVEL0 - yD(S.phi))) + " мм из 16";
  } else read.style.display = "none";
  requestAnimationFrame(frame);
}
sync();
requestAnimationFrame(frame);
window.__anim = { get state() { return { done, anim: anim && { i: anim.i, t: anim.t }, auto, paused, work: !!work, phi: lastS && lastS.phi, coverMode }; },
  set(n) { stopWork(); anim = null; auto = false; done = n; sync(); }, seek(i, t) { stopWork(); auto = false; done = i; anim = { i, t }; paused = true; sync(); },

})();
